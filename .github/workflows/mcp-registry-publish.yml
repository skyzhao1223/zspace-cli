name: Publish to MCP Registry

# 官方模式：https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx
# release.yml 已经会 git tag "v$VER" 并 push，所以用 tag 触发即可，
# 不必改动现有的 PyPI Trusted Publishing 流程（避免同一 job 内两个 OIDC audience 相互干扰）。

on:
  # release.yml pushes the v* tag with the default GITHUB_TOKEN (actions/checkout
  # without an explicit `token:`), and per GitHub's docs "events triggered by the
  # GITHUB_TOKEN will not create a new workflow run" — except workflow_dispatch
  # and repository_dispatch. So a bare `push: tags` trigger never fires here.
  # workflow_run is the automatic path; workflow_dispatch covers backfills.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  push:
    tags: ["v*"]   # still works for tags pushed by hand or with a PAT

jobs:
  publish:
    runs-on: ubuntu-latest
    # Do not publish on the back of a failed release.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write   # OIDC 认证必需
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # server.json 里的 version 必须与 tag 一致，否则 registry 会记录错版本。
      # 仓库目前是手工维护的（曾出现 registry 停在 0.1.4 而 PyPI 已到 0.1.7 的漂移），
      # 这一步把它变成自动同步，从根上消除漂移。
      - name: Sync version into server.json
        run: |
          # Derive from the newest tag, not GITHUB_REF: under workflow_run and
          # workflow_dispatch the ref is the default branch, not a tag.
          # ls-remote is used instead of `git describe` because the checkout is
          # shallow (fetch-depth defaults to 1), where tag reachability is fragile.
          VERSION=${GITHUB_REF#refs/tags/}
          if [ "$VERSION" = "$GITHUB_REF" ] || [ -z "$VERSION" ]; then
            VERSION=$(git ls-remote --tags --refs origin \
              | awk -F/ '{print $NF}' | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::no tag found; cannot determine the version to publish"
            exit 1
          fi
          jq --arg v "$VERSION" '
            .version = $v
            | (.packages[]? | select(.registryType == "pypi") | .version) = $v
          ' server.json > server.tmp && mv server.tmp server.json
          echo "server.json version -> $VERSION"
          jq '{name, version, packages: [.packages[].version]}' server.json

      # Fail here rather than at publish time: server.json drifted out of schema
      # compliance once already (description grew to 223 chars against a
      # maxLength of 100), which silently blocked every registry publish for
      # three releases. Validating against the $schema the file itself declares
      # means a future limit change is picked up automatically.
      - name: Validate server.json against its declared schema
        run: |
          python -m pip install --quiet jsonschema requests
          python - <<'PY'
          import json, sys, requests, jsonschema
          doc = json.load(open("server.json", encoding="utf-8"))
          url = doc.get("$schema")
          if not url:
              sys.exit("server.json has no $schema; cannot validate")
          schema = requests.get(url, timeout=30).json()
          errors = sorted(jsonschema.Draft202012Validator(schema).iter_errors(doc),
                          key=lambda e: list(e.path))
          for e in errors:
              path = "/".join(map(str, e.path)) or "(root)"
              print(f"::error file=server.json::schema violation at {path}: {e.message}")
          if errors:
              sys.exit(f"server.json failed schema validation ({len(errors)} violation(s))")
          print(f"server.json valid against {url}")
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
