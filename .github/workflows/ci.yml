name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
        if: matrix.python-version == '3.9'
      - run: pip install -e ".[mcp,dev]"
        if: matrix.python-version != '3.9'
      - run: ruff check src tests
      - run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[mcp,dev]"
      - run: python -m pyright

  skills:
    # Windows is in the matrix because these scanners are advertised as
    # cross-platform and 极空间 ships a Windows client — yet until now every
    # smoke test only ever ran on Linux. Real bug it caught: printing Chinese to
    # a redirected stdout raises UnicodeEncodeError under a non-UTF-8 locale
    # encoding (cp1252/GBK), which is exactly how an AI agent invokes them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Lint skill scripts
        shell: bash
        run: |
          pip install "ruff>=0.11"
          ruff check skills
      - name: Verify packaged skill copies are in sync
        shell: bash
        run: |
          fail=0
          for d in skills/*/; do
            n=$(basename "$d")
            if ! diff -rq -x __pycache__ "$d" "src/zspace_cli/skills/$n" >/dev/null 2>&1; then
              echo "OUT OF SYNC: $n"
              fail=1
            fi
          done
          diff -q skills/README.md src/zspace_cli/skills/README.md >/dev/null || {
            echo "OUT OF SYNC: README.md"
            fail=1
          }
          if [ $fail -ne 0 ]; then
            echo "Run the sync command in CONTRIBUTING.md → 'Skills live in two places'"
            exit 1
          fi
          echo "all skill copies in sync"
      - name: Docs state the right number of skills
        shell: bash
        run: |
          # Hardcoded counts went stale three times in a row (8 → 9 → 10, each in
          # a different direction), including a beginner-guide verification step
          # that made a successful install look like a failure. Assert them
          # instead of remembering to update them.
          total=$(ls -d skills/*/ | wc -l | tr -d ' ')
          org=$((total - 1))          # minus zspace-nas (the base, not an organizer)
          echo "zs skill installs $total; $org cross-NAS organizers"
          fail=0
          ORG_RE="[0-9]+ (cross-NAS organizer skills|read-only organizer skills|个跨 NAS 整理 skill|个整理/审计 skill)"
          DOCS="README.md docs/README.zh.md docs/integrations.md skills/README.md"
          stale=$(grep -ohE "$ORG_RE" $DOCS | grep -v "^$org " || true)
          [ -n "$stale" ] && { echo "STALE organizer count:"; echo "$stale"; fail=1; }
          stale2=$(grep -ohE "已复制 [0-9]+ 个 skill" docs/beginner-guide.zh.md docs/beginner-guide.md \
                  | grep -v "已复制 $total 个 skill" || true)
          [ -n "$stale2" ] && { echo "STALE installed count:"; echo "$stale2"; fail=1; }
          # Guard against this check silently matching nothing (wording changed
          # → the grep returns empty → the assertion passes vacuously).
          found=$(grep -ohE "$ORG_RE" $DOCS | wc -l | tr -d ' ')
          if [ "$found" -lt 4 ]; then
            echo "only $found matches (expected >= 4) — the wording changed and this"
            echo "check is now vacuous; update ORG_RE alongside the docs"
            fail=1
          fi
          if [ $fail -ne 0 ]; then
            echo "Fix the counts. If a skill was just added/removed, this is the reminder."
            exit 1
          fi
          echo "documented skill counts match reality"
      - name: Docs list every MCP tool
        shell: bash
        run: |
          # The CLI/SDK/MCP mapping table in both READMEs silently omitted two of
          # the fourteen registered tools (zspace_pool_info, zspace_disk_stats)
          # for several releases. The stale count then propagated into an external
          # directory listing that quoted the table, turning a docs bug into a
          # public one. Derive the truth from the source instead of trusting prose.
          tools=$(grep -oE '^(async )?def (zspace_[a-z_0-9]+)' src/zspace_cli/mcp_server.py \
                  | grep -oE 'zspace_[a-z_0-9]+' | sort -u)
          n=$(printf '%s\n' "$tools" | grep -c .)
          echo "$n registered MCP tools"
          fail=0
          # Guard against a vacuous pass first: if the def pattern ever changes,
          # $tools goes empty and the per-file loop below would have nothing to
          # check and report success. Same self-check shape as the skill counts.
          if [ "$n" -lt 10 ]; then
            echo "only extracted $n tool names (expected >= 10) - the source pattern"
            echo "changed and this check is now vacuous; update the grep above"
            fail=1
          fi
          BT='`'
          for f in README.md docs/README.zh.md; do
            missing=$(for t in $tools; do grep -qF "$BT$t$BT" "$f" || printf '%s\n' "$t"; done)
            if [ -n "$missing" ]; then
              echo "MISSING from $f:"
              printf '%s\n' "$missing" | sed 's/^/  /'
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "Update the mapping table. If a tool was just added or removed,"
            echo "this is the reminder."
            exit 1
          fi
          echo "both READMEs document all $n MCP tools"
      - name: Smoke tests (offline fixtures, py3.9 = min supported)
        shell: bash
        env:
          # windows-latest has no python3.exe, only python.exe
          PY: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
          # The smoke scripts' own inline python heredocs print ✓/❌/中文, which
          # raises UnicodeEncodeError under Windows' cp1252 redirected stdout —
          # the same class of bug the scanners just got fixed for. Scoped to
          # stdio only (not PYTHONUTF8=1, which would also silently change
          # open()'s default encoding and could mask a real bug). The encoding
          # regression test inside each smoke.sh still sets =ascii per-command,
          # which overrides this and keeps testing the scanner's own guard.
          PYTHONIOENCODING: utf-8
        run: |
          echo "using PY=$PY ($($PY -V 2>&1))"
          for d in skills/*/; do
            [ -f "$d/tests/smoke.sh" ] || continue
            echo "::group::smoke $d"
            bash "$d/tests/smoke.sh"
            echo "::endgroup::"
          done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t zspace-cli .
      - name: MCP handshake (initialize + tools/list)
        run: |
          set +e
          {
            printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list"}\n'
            # keep stdin open long enough for slow runners to answer tools/list
            # (sleep 1 flaked: server got EOF before responding)
            sleep 5
          } | docker run --rm -i zspace-cli >/tmp/mcp-out.txt 2>/tmp/mcp-err.txt
          rc=$?
          echo "exit=$rc"
          echo "--- stderr ---"
          cat /tmp/mcp-err.txt
          echo "--- stdout (first 500) ---"
          head -c 500 /tmp/mcp-out.txt
          echo
          [ $rc -eq 0 ] && python3 scripts/mcp_smoke.py < /tmp/mcp-out.txt
