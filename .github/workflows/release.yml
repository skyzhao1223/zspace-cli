name: Release

on:
  workflow_dispatch:
    inputs:
      how:
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # PyPI Trusted Publishing (OIDC) — no long-lived token
      packages: write   # Publish the container image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp,dev]" build
      - name: doctor gate
        run: python -c "import zspace_cli; print('ok', zspace_cli.__version__)"
      - name: bump version
        id: version
        run: |
          NEW=${{ inputs.how }}
          python - <<'EOF'
          import os, re, pathlib
          how = "${{ inputs.how }}"
          py = pathlib.Path("pyproject.toml")
          m = re.search(r'^version\s*=\s*"([^"]+)"', py.read_text(), re.M)
          cur = tuple(int(x) for x in m.group(1).split("."))
          if how == "major": new = (cur[0]+1, 0, 0)
          elif how == "minor": new = (cur[0], cur[1]+1, 0)
          else: new = (cur[0], cur[1], cur[2]+1)
          ver = ".".join(str(x) for x in new)
          text = py.read_text()
          py.write_text(re.sub(r'^version\s*=\s*"[^"]+"', f'version = "{ver}"', text, count=1, flags=re.M))
          init = pathlib.Path("src/zspace_cli/__init__.py")
          # version comes from importlib.metadata, so pyproject is the single source
          print("bumped to", ver)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={ver}\n")
          EOF
      - name: build + verify
        run: |
          python -m build
          python -c "import zipfile, glob; w=sorted(glob.glob('dist/*.whl'))[-1]; z=zipfile.ZipFile(w); print('wheel ok', len(z.namelist()), 'entries')"
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}   # gh CLI requires this in Actions
        run: |
          VER=$(python -c "import re,pathlib; m=re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.M); print(m.group(1))")
          # Keep the committed server.json truthful. mcp-registry-publish.yml
          # rewrites its *own* checkout from the tag, so the registry is fine —
          # but nothing ever updated the file in the repo, and it had drifted to
          # 0.1.7 while 0.1.9 was what shipped. Syncing here means the release
          # commit carries it and it can never drift again.
          #
          # This runs AFTER the PyPI publish, inside the step that cuts the tag.
          # `run:` defaults to `bash -e`, so an exception here would abort before
          # `git tag` — leaving a published version with no tag, no GitHub
          # Release and no MCP Registry publish, which is exactly the failure the
          # ordering comment below warns about. The sync is cosmetic (the registry
          # derives its own version from the tag), so it must never be able to
          # block the tag: `|| echo ::warning::` and carry on.
          VER="$VER" python - <<'EOF' || echo "::warning::server.json sync failed; tagging anyway (the registry derives its version from the tag, so only the committed file stays stale)"
          import json, os, pathlib
          ver = os.environ["VER"]
          p = pathlib.Path("server.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = ver
          for pkg in data.get("packages", []):
              if pkg.get("registryType") == "pypi":
                  pkg["version"] = ver
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n",
                       encoding="utf-8")
          print("server.json synced to", ver)
          EOF
          git add -A
          git -c user.email="actions@github.com" -c user.name="GitHub Actions" \
            commit -q -m "chore: release v$VER"
          git tag "v$VER"
          git push && git push origin "v$VER"
          gh release create "v$VER" --repo "${{ github.repository }}" \
            --title "zspace-cli v$VER" --generate-notes

      # Order matters: PyPI publishing and the git tag are irreversible / load-bearing,
      # while the multi-arch image build is a derivative artifact and the most likely step
      # to fail (QEMU-emulated arm64). Tag and cut the release first so a Docker failure
      # cannot leave a published PyPI version with no tag, no GitHub Release, and no
      # MCP Registry publish (the registry workflow is triggered by the v* tag push).

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - name: Publish Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}